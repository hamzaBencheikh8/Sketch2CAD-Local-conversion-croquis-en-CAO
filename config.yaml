# Configuration Sketch2CAD-Local
# Profil par défaut ; surchargeable avec --profile (gpu8 | gpu4 | cpu | offline | api)
profile: offline

# Ollama doit rester local : les croquis ne quittent jamais la machine.
ollama_host: http://localhost:11434

# Profil « api » : lecture des cotes par une API GRATUITE (le solveur et la CAO restent locaux).
# Réglable aussi dans l'interface web (bouton « API ») ou avec : python -m sketch2cad api --help
# La clé n'est jamais écrite ici : variable d'environnement (GEMINI_API_KEY, GROQ_API_KEY,
# OPENROUTER_API_KEY) ou fichier api_settings.json (ignoré par git).
api:
  provider: gemini        # gemini | groq | openrouter
  model: ""               # vide = modèle par défaut du fournisseur
  scope: textes           # textes = seules les zones de texte sortent du PC ; complet = image entière

default_thickness: 5.0          # mm, si aucune épaisseur n'est écrite sur le croquis
ocr_backends: [paddle, easyocr, tesseract]   # essayés dans cet ordre
max_critic_iterations: 3
iou_min: 0.6                    # ressemblance minimale croquis / profil résolu

profiles:
  gpu8:      # GPU 8 à 12 Go : modèles 7B quantifiés, chargés l'un après l'autre
    vlm: qwen2.5vl:7b
    coder: qwen2.5-coder:7b
    vlm_critic: true
  gpu4:      # GPU 4 à 8 Go
    vlm: qwen2.5vl:3b
    coder: qwen2.5-coder:3b
    vlm_critic: true
  cpu:       # pas de GPU, au moins 16 Go de RAM (lent : 1 à 3 min par croquis pour le VLM)
    vlm: qwen2.5vl:3b
    coder: null
    vlm_critic: false
  offline:   # aucun modèle de langage : OCR + heuristiques + solveur
    vlm: null
    coder: null
    vlm_critic: false
  api:       # OCR local relu par une API gratuite (Gemini, Groq ou OpenRouter)
    vlm: null
    coder: null
    vlm_critic: false
    cloud: true
